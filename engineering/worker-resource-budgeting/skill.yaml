  rationale: 'Post-reboot 2026-10-13 17:06, verification workers consumed ~7GB leaving 644MB free and the live bot died 3x silently at startup (message:assistant-msg-61744052-e775-4599-ad5f-80f6e06d04c5); each worker loads the full 176k-pattern brain at 400–700MB RSS (message:assistant-msg-56ab2f55-d384-4ca2-9017-01ef727fa69f). The pattern of fanning out parallel full-brain workers recurs in every serapan/tumpah-ilmu verification pass. The fix: check free RAM before fan-out, cap concurrency at budget/700MB with 2GB headroom reserved for the bot, prefer slim hash-set workers for dedupe-only tasks, and throttle workers before deploys/restarts.'
