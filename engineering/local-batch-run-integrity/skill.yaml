  rationale: 'Two integrity failures in one window: (a) singkatan-EN wave 1 lost ALL progress when the runtime killed the run — no progress file, 0 entries merged (message:assistant-msg-4e62d3a2-9654-e25e-4269-64d6e00326a3f, message:assistant-msg-e23bd089-8fd4-4f65-ae7a-87c1743ba941); (b) serapan run ke-8 claimed 24 batches/1,200 intent but 650 intent had no files on disk (message:assistant-msg-e0c2600d-d971-b67e-dfc1-cd4f4ab3f285), later salvaged to 670 live (message:assistant-msg-515c3e81-6244-65a5-ae2f-d7f44da581ab). Related staleness: ID-range collisions recur because max-ID is verified at draft time, not deploy time (AGENTS.md ''tabrakan-ID'' lesson, 2026-10-12). The fix is one method: per-chunk on-disk checkpoints with resume, claim-vs-artifact reconciliation, and deploy-time re-verification of race-sensitive allocations.'
